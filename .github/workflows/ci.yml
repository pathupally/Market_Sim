name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-cxx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMARKETFORGE_WARNINGS_AS_ERRORS=ON
          -DMARKETFORGE_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Validate replay assets
        run: |
          node --check demo/app.js
          jq -e '.project == "market_sim" and (.frames | length) == 48' demo/radar-trace.json

  python-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/modal/requirements.txt
      - name: Install test dependency
        run: python -m pip install -r tools/modal/requirements.txt
      - name: Test inference contracts
        run: python -m unittest discover -s tools/inference -t . -p 'test_*.py'
      - name: Test model tooling
        run: python -m unittest discover -s tools/model -t . -p 'test_*.py'
      - name: Test bounded Modal tooling
        run: python -m unittest discover -s tools/modal -t . -p 'test_*.py'
